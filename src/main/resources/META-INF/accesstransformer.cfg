# The fantasy encoding terminal scrolls a 3x3 window over its 81 ingredient slots, which means moving the slots
# themselves every frame. Slot#x/#y are public but final in vanilla, so they have to be de-finalized first.
# AE2 ships the exact same two lines for its own processing pattern mode.
public-f net.minecraft.world.inventory.Slot x
public-f net.minecraft.world.inventory.Slot y
