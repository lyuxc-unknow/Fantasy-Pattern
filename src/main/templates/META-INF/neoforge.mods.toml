modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"

# De-finalizes Slot#x/#y so the encoding terminal can scroll its ingredient slots.
[[accessTransformers]]
    file="META-INF/accesstransformer.cfg"

# Keeps fantasy patterns out of AE2's own pattern providers. Functional, so its config is required: if it stops
# applying, patterns could end up somewhere that would execute them wrongly.
[[mixins]]
    config="fantasy_technology.mixins.json"

# Cosmetic only - showing a pattern's first output in pattern slots and while shift is held. Declared optional so an
# AE2 update that moves these internals costs the icons, not the whole game.
[[mixins]]
    config="fantasy_technology.client.mixins.json"

[[mods]] #mandatory
modId="fantasy_technology" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
description='''
Fantasy Technology
'''

[[dependencies.fantasy_technology]] #optional
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="[${neo_version},)" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.fantasy_technology]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.fantasy_technology]]
    modId="ae2"
    type="required"
    versionRange="[${ae2_version},)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.fantasy_technology]]
    modId="jei"
    type="required"
    versionRange="[19,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.fantasy_technology]]
    modId="mekanism"
    type="optional"
    versionRange="[10.7,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.fantasy_technology]]
    modId="appmek"
    type="optional"
    versionRange="[1.6,)"
    ordering="AFTER"
    side="BOTH"

