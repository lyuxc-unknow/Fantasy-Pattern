## Compile-time APIs and runtime implementations
# All dependency versions/file IDs are maintained here. Plugin versions remain in the plugins blocks.

# Applied Energistics 2 (NeoForge 1.21.1), fetched from the Modrinth Maven:
# https://modrinth.com/mod/ae2/versions?l=neoforge&g=1.21.1
ae2_version=19.2.18
# GuideME is a required dependency of AE2, fetched from Maven Central:
# https://central.sonatype.com/artifact/org.appliedenergistics/guideme
guideme_version=21.1.17
# JEI (required, used for recipe transfer into the fantasy encoding terminal):
# https://maven.blamejared.com/mezz/jei/
jei_version=19.56.0.438

# Mekanism and Applied Mekanistics (both optional, together they allow chemicals in patterns):
# https://modmaven.dev/mekanism/Mekanism/ and https://modrinth.com/mod/applied-mekanistics
mekanism_version=1.21.1-10.7.19.85
applied_mekanistics_version=1.6.3

