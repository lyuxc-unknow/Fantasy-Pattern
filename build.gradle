plugins {
    id 'org.glavo.gradle-wrapper-neo' version "0.2.0"
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

// LGPL-3.0 compliance: the bundled AE2-VM fork (see THIRD_PARTY_NOTICES.md) must ship
// with its license text and the notice that names it, inside the distributed jar.
tasks.named('jar', Jar) {
    from('LICENSES') {
        into 'LICENSES'
    }
    from('THIRD_PARTY_NOTICES.md')
}


base {
    archivesName = "FantasyPattern-" + minecraft_version
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            // gameDirectory = project.file('run-data')

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    mavenLocal()
    // GuideME (required AE2 dependency) is published to Maven Central
    mavenCentral()
    // AE2 for NeoForge 1.21.1 is published on the Modrinth Maven
    maven {
         name = 'Modrinth'
         url = 'https://api.modrinth.com/maven'
         content {
             includeGroup 'maven.modrinth'
         }
    }
    // JEI
    maven {
         name = 'Jared Maven'
         url = 'https://maven.blamejared.com'
         content {
             includeGroup 'mezz.jei'
         }
    }
    // Mekanism (its API is what we compile against)
    maven {
         name = 'ModMaven'
         url = 'https://modmaven.dev/'
         content {
             includeGroup 'mekanism'
         }
    }
    // CurseForge, for dev-run-only mods that publish nowhere else
    maven {
         name = 'CurseMaven'
         url = 'https://cursemaven.com'
         content {
             includeGroup 'curse.maven'
         }
    }
}

dependencies {
    // Applied Energistics 2: compile against the mod jar, and load the full mod in dev runs
    compileOnly "maven.modrinth:ae2:${ae2_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    localRuntime "maven.modrinth:ae2:${ae2_version}"
    // Applied Mekanistics bridges mekanism chemicals into AE2's key system; both it and mekanism are optional
    compileOnly "maven.modrinth:applied-mekanistics:${applied_mekanistics_version}"
    localRuntime "maven.modrinth:applied-mekanistics:${applied_mekanistics_version}"
    // GuideME is a required dependency of AE2 and must be present in dev runs
    localRuntime "org.appliedenergistics:guideme:${guideme_version}"

    // JEI: required for recipe transfer into the fantasy encoding terminal; compile against the API, include the
    // full mod in dev runs
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // Mekanism: compile against the API only, load the full mod and its modules in dev runs
    compileOnly "mekanism:Mekanism:${mekanism_version}:api"
    localRuntime "mekanism:Mekanism:${mekanism_version}" // Mekanism
    localRuntime "mekanism:Mekanism:${mekanism_version}:additions" // Mekanism: Additions
    localRuntime "mekanism:Mekanism:${mekanism_version}:generators" // Mekanism: Generators
    localRuntime "mekanism:Mekanism:${mekanism_version}:tools" // Mekanism: Tools

    // AE2 JEI Integration, dev runs only: makes AE2 recipes show up in JEI so recipe transfer can be tested.
    // https://www.curseforge.com/minecraft/mc-mods/ae2-jei-integration
    localRuntime "curse.maven:ae2-jei-integration-${ae2_jei_integration_project}:${ae2_jei_integration_file}"

    compileOnly "curse.maven:omnisequence-transfinite-1624558:8580768"
    localRuntime "curse.maven:omnisequence-transfinite-1624558:8580768"

    // Compatibility verification
    localRuntime "maven.modrinth:modern-industrialization:2.5.5"
    localRuntime "curse.maven:alltheleaks-1091339:8553655"
    localRuntime "maven.modrinth:mekanism_extra:1.21.1-1.4.0"
    localRuntime "maven.modrinth:cucumber:8.0.16"
    localRuntime "maven.modrinth:mystical-agriculture:8.0.27"
    localRuntime "maven.modrinth:neoecoae:21.1.1"
    localRuntime "maven.modrinth:ldlib:mc1.21.1-2.2.32-neoforge"
    localRuntime "curse.maven:glodium-957920:5821676"
    localRuntime "curse.maven:ex-pattern-provider-892005:8511901"
    localRuntime(jarJar("com.ae2vm.addon:ae2vm:1.10.1+modified"))
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        ae2_version            : ae2_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
